<!DOCTYPE html>
<html>
<head>
  <title>Students Data</title>
  <style>
    .fail {
      color: red;
      font-weight: bold;
    }
    table {
      border-collapse: collapse;
      width: 60%;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<h2>All Students</h2>
<ul id="studentList"></ul>

<h2>Students Scored More Than 60</h2>
<ul id="above60"></ul>

<h2>Department Count</h2>
<p id="deptCount"></p>

<h2>Top Scorer</h2>
<p id="topper"></p>

<h2>Students Table</h2>
<table id="studentTable">
  <tr>
    <th>Name</th>
    <th>Marks</th>
    <th>Department</th>
  </tr>
</table>

<h2>Average Marks</h2>
<p id="average"></p>

<h2>CSE Students</h2>
<ul id="cseStudents"></ul>

<h2>Sorted Students (Marks Descending)</h2>
<ul id="sortedStudents"></ul>

<script>
const students = [
  { id: 1, name: "Karishma", marks: 78, department: "CSE" },
  { id: 2, name: "Ajay", marks: 92, department: "ECE" },
  { id: 3, name: "Sai", marks: 45, department: "MECH" },
  { id: 4, name: "Mahi", marks: 66, department: "CSE" },
  { id: 5, name: "Bhavani", marks: 88, department: "ECE" },
  { id: 6, name: "Shiva", marks: 59, department: "CSE" },
  { id: 7, name: "Lucky", marks: 93, department: "ECE" },
  { id: 8, name: "Nikhil", marks: 54, department: "MECH" },
  { id: 9, name: "Manu", marks: 67, department: "CSE" },
  { id: 10, name: "Nimitha", marks: 78, department: "ECE" }
  
];

const studentList = document.getElementById("studentList");
students.forEach(s => {
  const li = document.createElement("li");
  li.textContent = s.name;
  if (s.marks < 50) li.classList.add("fail"); 
  studentList.appendChild(li);
});


const above60 = document.getElementById("above60");
students.filter(s => s.marks > 60).forEach(s => {
  above60.innerHTML += `<li>${s.name} - ${s.marks}</li>`;
});


const deptCount = students.reduce((acc, s) => {
  acc[s.department] = (acc[s.department] || 0) + 1;
  return acc;
}, {});
document.getElementById("deptCount").textContent = JSON.stringify(deptCount);


const topper = students.reduce((max, s) => s.marks > max.marks ? s : max);
document.getElementById("topper").textContent =
  `${topper.name} (${topper.marks})`;


const table = document.getElementById("studentTable");
students.forEach(s => {
  const row = table.insertRow();
  row.innerHTML = `
    <td>${s.name}</td>
    <td class="${s.marks < 50 ? 'fail' : ''}">${s.marks}</td>
    <td>${s.department}</td>
  `;
});


const avg = students.reduce((sum, s) => sum + s.marks, 0) / students.length;
document.getElementById("average").textContent = avg.toFixed(2);


students.filter(s => s.department === "CSE").forEach(s => {
  document.getElementById("cseStudents").innerHTML += `<li>${s.name}</li>`;
});


[...students].sort((a, b) => b.marks - a.marks).forEach(s => {
  document.getElementById("sortedStudents").innerHTML +=
    `<li>${s.name} - ${s.marks}</li>`;
});


const newStudent = { id: 6, name: "Anjali", marks: 55, department: "CSE" };
students.push(newStudent);

const li = document.createElement("li");
li.textContent = newStudent.name;
studentList.appendChild(li);

</script>

</body>
</html>
